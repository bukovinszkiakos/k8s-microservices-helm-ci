global:
  imageRegistry: ghcr.io/bukovinszkiakos
  imageTag: ""
  imagePullPolicy: IfNotPresent

existingSecret: flotilla-secrets

postgres:
  image:
    repository: postgres
    tag: "18.6-alpine3.24"
  database: inventory
  user: flotilla
  storage: 1Gi
  storageClassName: ""
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      memory: 256Mi

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1000
  runAsGroup: 1000
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL

services:
  auth-service:
    replicas: 2
    env: {}
    secretEnv:
      API_TOKEN: api-token
    resources:
      requests:
        cpu: 100m
        memory: 64Mi
      limits:
        memory: 128Mi
    autoscaling:
      enabled: true
      minReplicas: 2
      maxReplicas: 4
      targetCPUUtilizationPercentage: 70

  inventory-service:
    replicas: 2
    env:
      AUTH_URL: http://auth-service:8080
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_NAME: '{{ .Values.postgres.database }}'
      DB_USER: '{{ .Values.postgres.user }}'
    secretEnv:
      DB_PASSWORD: postgres-password
    resources:
      requests:
        cpu: 100m
        memory: 64Mi
      limits:
        memory: 128Mi
    autoscaling:
      enabled: true
      minReplicas: 2
      maxReplicas: 4
      targetCPUUtilizationPercentage: 70

  stats-service:
    replicas: 2
    env:
      INVENTORY_URL: http://inventory-service:8080
    secretEnv: {}
    resources:
      requests:
        cpu: 100m
        memory: 64Mi
      limits:
        memory: 128Mi
    autoscaling:
      enabled: true
      minReplicas: 2
      maxReplicas: 4
      targetCPUUtilizationPercentage: 70

gateway:
  image:
    repository: nginxinc/nginx-unprivileged
    tag: "1.31.7-alpine"
    pullPolicy: IfNotPresent
  replicas: 2
  resources:
    requests:
      cpu: 50m
      memory: 32Mi
    limits:
      memory: 64Mi
  service:
    type: ClusterIP
    nodePort: null

tests:
  image: busybox:1.38.0
