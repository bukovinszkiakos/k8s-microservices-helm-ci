log_format json_access escape=json
    '{"time":"$time_iso8601",'
     '"request_id":"$request_id",'
     '"method":"$request_method",'
     '"uri":"$request_uri",'
     '"status":$status,'
     '"duration":$request_time,'
     '"upstream_status":"$upstream_status"}';

server {
    listen 8080;
    access_log /dev/stdout json_access;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Trailing slash on proxy_pass strips the /api/inventory prefix before forwarding.
    location /api/inventory/ {
        proxy_pass http://inventory-service:8080/;
        proxy_set_header Host $host;
        proxy_set_header X-Request-ID $request_id;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /api/stats/ {
        proxy_pass http://stats-service:8080/;
        proxy_set_header Host $host;
        proxy_set_header X-Request-ID $request_id;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # auth-service has no public route.
    location / {
        default_type application/json;
        return 404 '{"error":"not found"}';
    }
}
